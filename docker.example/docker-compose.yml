# Our Home — the web app. Copy this folder to `docker/` (which is gitignored),
# create the repo-root `settings.yml` and `.env` from their `.example`
# templates, then from `docker/`:
#
#   ./deploy.sh                 # or .\deploy.ps1
#
# The first run walks through the settings. Then open http://<server-ip>:3000
# and the setup page creates the accounts.
#
# Nothing here is edited by hand. Settings live in ../settings.yml (read by the
# app inside the container) and secrets in ../.env (passed in as environment
# variables). The deploy scripts pass settings.yml's `docker:` section
# (project, container, network, port, bind) to this file as DOCKER_*, and the
# source to build as BUILD_CONTEXT.
# Plain `docker compose up -d --build` also works and uses the defaults below.
#
# Bring your own MongoDB: it must be a replica set (the app uses transactions).
# Point DATABASE_URL in .env at it. The 15-minute reminder sweep runs inside
# the app, so nothing else needs to run. See README.md in this folder.

name: ${DOCKER_PROJECT:-ourhome}

services:
  web:
    build:
      # GitHub repo#branch (BuildKit fetches it and checks for new commits on
      # every build), or `..` for this checkout (deploy -l). The deploy scripts
      # set it from settings.yml docker.repo / docker.branch.
      context: ${BUILD_CONTEXT:-https://github.com/EOSOClub/OurHome.git#main}
      # Relative to the source being built, so the image recipe always matches
      # the code it builds.
      dockerfile: docker.example/web/Dockerfile
    container_name: ${DOCKER_CONTAINER:-ourhome_web}
    restart: unless-stopped
    # Secrets (passwords, keys, the database URL) as environment variables.
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      SETTINGS_FILE: /app/settings.yml
      APP_DOWNLOAD_DIR: /app/downloads
    volumes:
      # The settings file, read-only. Not baked into the image, so it never
      # ends up in an image layer, and a change only needs a restart.
      - type: bind
        source: ../settings.yml
        target: /app/settings.yml
        read_only: true
        bind:
          # Fail clearly if it's missing, rather than mounting an empty folder.
          create_host_path: false
      # The Android app the deploy builds (android/out: ourhome.apk +
      # ourhome.json), offered to signed-in members on the Profile page.
      # Empty when the app isn't built here; then the page shows nothing.
      - type: bind
        source: ../android/out
        target: /app/downloads
        read_only: true
        bind:
          create_host_path: true
    ports:
      # Open to your home network by default (plain HTTP). For access from
      # outside, put a tunnel / reverse proxy (Cloudflare Tunnel, Caddy, nginx)
      # in front for HTTPS; never forward this port on your router.
      # docker.bind: 127.0.0.1 limits it to this machine.
      - "${DOCKER_BIND:-0.0.0.0}:${DOCKER_PORT:-3000}:3000"

networks:
  # A shared, pre-created network (not one compose makes per project), so other
  # stacks such as MongoDB can join it too.
  default:
    name: ${DOCKER_NETWORK:-ourhome_net}
    external: true
